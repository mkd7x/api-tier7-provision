services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-tier7-provision-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=api_tier7_provision;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: api-tier7-provision-postgres
    environment:
      POSTGRES_DB: api_tier7_provision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_tier7_provision"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
